[project]
name = "industrial-sandbox-ml-training-v0-1"
version = "0.1.0"
description = "Block 1B offline ML training lane for the industrial Isolation Forest sandbox."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "joblib==1.4.2",
  "jsonschema==4.25.1",
  "numpy==2.2.6",
  "polars==1.33.1",
  "pyarrow==21.0.0",
  "python-dotenv==1.1.1",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
]

[dependency-groups]
dev = [
  "ipykernel==6.30.1",
  "jupyterlab==4.4.7",
  "matplotlib==3.10.6",
  "seaborn==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
