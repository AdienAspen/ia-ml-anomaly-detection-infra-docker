[project]
name = "industrial-sandbox-agents"
version = "0.1.0"
description = "Agentic observability layer for anomaly triage and diagnosis."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "redis>=5.0",
  "pytest>=8.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
